<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="menulogowania.css">
</head>
<body>
  <nav>
          <a href="./index.html"><img src="./oscypek.svg"/></a>
  </nav>
  <main>
  <div class="login-container">
    <h2>Poć do bacówki</h2>
    <form action="#" method="POST" class="login-form">
      <div class="form-group">
        <label for="username">Jako cie zwom:</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Hasło:</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group">
        <button type="submit" id="lewy">Włazem</button>
        <button type="submit" id="prawy"><a href="./menutworzeniakonta.html">Jestek nowy</a></button>
      </div>
    </form>
  </div>
  </main>
</body>
</html>
